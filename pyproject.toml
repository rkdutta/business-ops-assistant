[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "business-ops-assistant"
version = "0.1.0"
requires-python = ">=3.10"

[tool.setuptools]
packages = ["models", "agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: hits a real local dependency (Ollama, Docker, MCP) — skipped by default, run with -m integration",
]
addopts = "-m 'not integration'"
